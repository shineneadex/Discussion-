name: Build discussion board
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/live-discussion-board]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build production app
        run: npm run build
